<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i5s Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(255,0,0,.15);
filter:blur(120px);
top:-200px;
left:-150px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(255,0,0,.15);
filter:blur(120px);
bottom:-200px;
right:-150px;
z-index:-1;
}

.hidden{
display:none!important;
}

.login-screen{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-box{
width:430px;
background:#0d0d0d;
border:1px solid #1e1e1e;
border-radius:30px;
padding:45px;
box-shadow:0 0 50px rgba(255,0,0,.1);
}

.logo{
font-family:'Orbitron',sans-serif;
font-size:62px;
font-weight:900;
margin-bottom:10px;
background:linear-gradient(90deg,#ff2e2e,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
color:#777;
margin-bottom:30px;
font-size:16px;
}

input{
width:100%;
height:60px;
background:#111;
border:1px solid #222;
border-radius:15px;
padding:0 20px;
color:white;
font-size:16px;
margin-bottom:15px;
outline:none;
transition:.2s;
}

input:focus{
border-color:#ff2e2e;
}

button{
width:100%;
height:60px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:800;
cursor:pointer;
transition:.2s;
}

.login-btn{
background:#a30d0d;
color:white;
margin-bottom:15px;
}

.login-btn:hover{
background:#d81818;
}

.register-btn{
background:#151515;
color:white;
}

.register-btn:hover{
background:#222;
}

.navbar{
height:80px;
background:#0a0a0a;
border-bottom:1px solid #222;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

.nav-logo{
font-family:'Orbitron',sans-serif;
font-size:34px;
font-weight:900;
background:linear-gradient(90deg,#ff2e2e,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-right{
display:flex;
gap:12px;
align-items:center;
}

.balance,
.nav-btn{
height:45px;
padding:0 22px;
border-radius:14px;
background:#111;
border:1px solid #222;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.nav-btn{
cursor:pointer;
}

.nav-btn:hover{
background:#ff2e2e;
}

.page{
display:none;
padding:40px;
}

.active{
display:block;
}

.hero{
background:linear-gradient(135deg,#0d0d0d,#180707);
border:1px solid #222;
padding:60px;
border-radius:30px;
margin-bottom:30px;
}

.hero h1{
font-size:60px;
margin-bottom:10px;
}

.hero p{
font-size:18px;
color:#888;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#0e0e0e;
border:1px solid #222;
border-radius:25px;
padding:30px;
}

.card h2{
font-size:35px;
margin-bottom:15px;
}

.price{
font-size:42px;
font-weight:900;
color:#ff2e2e;
margin-bottom:20px;
}

.buy{
background:#b31212;
color:white;
}

.buy:hover{
background:#ff2e2e;
}

.inventory-item{
background:#101010;
padding:25px;
border-radius:20px;
border:1px solid #222;
margin-bottom:15px;
}

</style>
</head>
<body>

<div id="loginPage" class="login-screen">

<div class="login-box">

<div class="logo">i5s</div>

<div class="sub">
Secure Digital Store Login
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Login
</button>

<button class="register-btn" onclick="register()">
Create Account
</button>

</div>

</div>

<div id="mainSite" class="hidden">

<div class="navbar">

<div class="nav-logo">i5s</div>

<div class="nav-right">

<div class="balance">
$<span id="balance">0</span>
</div>

<div class="nav-btn" onclick="showPage('shop')">
Shop
</div>

<div class="nav-btn" onclick="showPage('inventory')">
Inventory
</div>

<div class="nav-btn" onclick="logout()">
Logout
</div>

</div>

</div>

<div id="shop" class="page active">

<div class="hero">

<h1>Premium Digital Store</h1>

<p>
Modern red & black premium dashboard
</p>

</div>

<div class="grid">

<div class="card">
<h2>1D</h2>
<div class="price">$10</div>
<button class="buy" onclick="buy(10,'1D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>3D</h2>
<div class="price">$25</div>
<button class="buy" onclick="buy(25,'3D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>5D</h2>
<div class="price">$40</div>
<button class="buy" onclick="buy(40,'5D Access')">
Purchase
</button>
</div>

</div>

</div>

<div id="inventory" class="page">

<h1 style="margin-bottom:20px;">Inventory</h1>

<div id="inventoryList"></div>

</div>

</div>

<script>

const ADMIN_USERNAME = "woojun";
const ADMIN_PASSWORD = "F1AX65DvCA45X";

let users = JSON.parse(localStorage.getItem("users")) || [];

let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;

/* 관리자 생성 */

if(!users.find(u => u.username === ADMIN_USERNAME)){

users.push({
username:ADMIN_USERNAME,
password:ADMIN_PASSWORD,
balance:999999,
inventory:[]
});

localStorage.setItem(
"users",
JSON.stringify(users)
);

}

/* 자동 로그인 */

window.onload = function(){

if(currentUser){

openSite();

}

}

/* 회원가입 */

function register(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

/* 핵심 수정 부분 */

if(username.length === 0 || password.length === 0){

alert("Please enter username and password");
return;

}

const exists = users.find(function(user){

return user.username.toLowerCase()
=== username.toLowerCase();

});

if(exists){

alert("Username already exists");
return;

}

const newUser = {

username:username,
password:password,
balance:0,
inventory:[]

};

users.push(newUser);

localStorage.setItem(
"users",
JSON.stringify(users)
);

currentUser = newUser;

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

alert("Account Created Successfully");

openSite();

}

/* 로그인 */

function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

if(username.length === 0 || password.length === 0){

alert("Please enter username and password");
return;

}

const foundUser = users.find(function(user){

return (
user.username === username &&
user.password === password
);

});

if(!foundUser){

alert("Invalid Account");
return;

}

currentUser = foundUser;

localStorage.setItem(
"currentUser",
JSON.stringify(foundUser)
);

openSite();

}

/* 사이트 열기 */

function openSite(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainSite")
.classList.remove("hidden");

updateBalance();

renderInventory();

}

/* 로그아웃 */

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

/* 페이지 */

function showPage(page){

document.querySelectorAll(".page")
.forEach(function(p){

p.classList.remove("active");

});

document.getElementById(page)
.classList.add("active");

}

/* 잔액 */

function updateBalance(){

document.getElementById("balance")
.innerText = currentUser.balance;

}

/* 저장 */

function saveUsers(){

users = users.map(function(user){

if(user.username === currentUser.username){

return currentUser;

}

return user;

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

}

/* 구매 */

function buy(price,name){

if(currentUser.balance < price){

alert("Not enough balance");
return;

}

currentUser.balance -= price;

currentUser.inventory.push(name);

saveUsers();

updateBalance();

renderInventory();

alert("Purchased: " + name);

}

/* 인벤토리 */

function renderInventory(){

const inventory =
document.getElementById("inventoryList");

inventory.innerHTML = "";

if(currentUser.inventory.length === 0){

inventory.innerHTML = `
<div class="inventory-item">
No items purchased yet
</div>
`;

return;

}

currentUser.inventory.forEach(function(item){

inventory.innerHTML += `
<div class="inventory-item">
${item}
</div>
`;

});

}

</script>

</body>
</html>
