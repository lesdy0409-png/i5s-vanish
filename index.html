<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>i5s Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#050505;
    color:white;
    overflow-x:hidden;
}

.hidden{
    display:none !important;
}

.login-screen{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:420px;
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:30px;
    padding:45px;
    box-shadow:0 0 40px rgba(255,0,0,0.15);
}

.logo-login{
    font-family:'Orbitron',sans-serif;
    font-size:56px;
    font-weight:900;
    background:linear-gradient(90deg,#ff2e2e,#ffffff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:10px;
}

.login-sub{
    color:#777;
    margin-bottom:25px;
}

input{
    width:100%;
    height:58px;
    background:#111;
    border:1px solid #222;
    border-radius:14px;
    padding:0 18px;
    color:white;
    margin-bottom:15px;
    outline:none;
}

.login-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:14px;
    background:#ff2e2e;
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.register-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:14px;
    background:#111;
    color:#999;
    margin-top:15px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.register-btn:hover{
    background:#1a1a1a;
    color:white;
}

.navbar{
    height:80px;
    background:#080808;
    border-bottom:1px solid #1b1b1b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:38px;
    font-weight:900;
    background:linear-gradient(90deg,#ff2e2e,#ffffff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.balance{
    padding:12px 20px;
    background:#111;
    border:1px solid #222;
    border-radius:14px;
}

.page{
    padding:35px;
}

.hero{
    background:#0b0b0b;
    border:1px solid #1f1f1f;
    border-radius:30px;
    padding:60px;
}

.hero h1{
    font-size:60px;
    font-weight:900;
}

.hero p{
    color:#999;
    margin-top:10px;
}

</style>
</head>

<body>

<div id="loginPage" class="login-screen">

    <div class="login-box">

        <h1 class="logo-login">i5s</h1>

        <p class="login-sub">
            Secure Digital Store Login
        </p>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <button type="button" class="register-btn" onclick="register()">
            Create Account
        </button>

    </div>

</div>

<div id="mainSite" class="hidden">

    <div class="navbar">

        <div class="logo">i5s</div>

        <div class="balance">
            Balance: $
            <span id="balance">0</span>
        </div>

    </div>

    <div class="page">

        <div class="hero">

            <h1>Welcome</h1>

            <p>
                Login and register system now fully working.
            </p>

        </div>

    </div>

</div>

<script>

const ADMIN_USERNAME = "woojun";
const ADMIN_PASSWORD = "F1AX65DvCA45X";

let users =
JSON.parse(localStorage.getItem("users")) || [];

let currentUser =
JSON.parse(localStorage.getItem("currentUser")) || null;

if(!users.find(u => u.username === ADMIN_USERNAME)){

    users.push({
        username:ADMIN_USERNAME,
        password:ADMIN_PASSWORD,
        balance:0,
        inventory:[]
    });

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}

window.onload = () => {

    if(currentUser){

        showSite();

    }

};

function register(){

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const username =
usernameInput.value.trim();

const password =
passwordInput.value.trim();

if(username === "" || password === ""){

alert("Fill all fields");
return;

}

if(username.length < 3){

alert("Username must be at least 3 characters");
return;

}

if(password.length < 3){

alert("Password must be at least 3 characters");
return;

}

let savedUsers =
JSON.parse(localStorage.getItem("users"));

if(!Array.isArray(savedUsers)){

savedUsers = [];

}

users = savedUsers;

const exists = users.some(function(user){

return user.username.toLowerCase() ===
username.toLowerCase();

});

if(exists){

alert("Username already exists");
return;

}

const newUser = {

username:username,
password:password,
balance:0,
inventory:[]

};

users.push(newUser);

localStorage.setItem(
"users",
JSON.stringify(users)
);

currentUser = newUser;

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

usernameInput.value = "";
passwordInput.value = "";

alert("Account Created Successfully");

showSite();

}

function login(){

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value.trim();

    const user =
    users.find(u =>
        u.username === username &&
        u.password === password
    );

    if(!user){

        alert("Invalid Account");
        return;

    }

    currentUser = user;

    localStorage.setItem(
        "currentUser",
        JSON.stringify(currentUser)
    );

    showSite();

}

function showSite(){

    document.getElementById("loginPage")
    .classList.add("hidden");

    document.getElementById("mainSite")
    .classList.remove("hidden");

    document.getElementById("balance")
    .innerText = currentUser.balance;

}

</script>

</body>
</html>
