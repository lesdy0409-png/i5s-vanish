<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i5s Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(255,0,0,.12);
filter:blur(120px);
top:-200px;
left:-150px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(255,0,0,.12);
filter:blur(120px);
bottom:-200px;
right:-150px;
z-index:-1;
}

.hidden{
display:none!important;
}

.login-screen{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:420px;
background:#0d0d0d;
border:1px solid #222;
border-radius:30px;
padding:45px;
box-shadow:0 0 40px rgba(255,0,0,.15);
}

.logo{
font-family:'Orbitron',sans-serif;
font-size:56px;
font-weight:900;
text-align:center;
margin-bottom:10px;
background:linear-gradient(90deg,#ff2e2e,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
text-align:center;
color:#777;
margin-bottom:25px;
}

input{
width:100%;
height:58px;
background:#111;
border:1px solid #222;
border-radius:14px;
padding:0 18px;
color:white;
margin-bottom:15px;
outline:none;
font-size:16px;
}

button{
cursor:pointer;
border:none;
}

.login-btn{
width:100%;
height:58px;
border-radius:14px;
background:#ff2e2e;
color:white;
font-size:16px;
font-weight:800;
}

.register-btn{
margin-top:16px;
text-align:center;
color:#aaa;
cursor:pointer;
}

.navbar{
height:80px;
background:#080808;
border-bottom:1px solid #1c1c1c;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

.logo-nav{
font-family:'Orbitron',sans-serif;
font-size:36px;
font-weight:900;
background:linear-gradient(90deg,#ff2e2e,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.right{
display:flex;
gap:12px;
align-items:center;
}

.balance,
.logout{
height:45px;
padding:0 20px;
background:#111;
border:1px solid #222;
border-radius:14px;
display:flex;
align-items:center;
font-weight:700;
}

.logout{
cursor:pointer;
}

.main{
padding:35px;
}

.hero{
background:linear-gradient(135deg,#090909,#1a0606);
border:1px solid #221111;
border-radius:30px;
padding:60px;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px;
margin-bottom:35px;
}

.hero h1{
font-size:58px;
font-weight:900;
margin-bottom:15px;
}

.hero p{
color:#999;
font-size:18px;
line-height:1.7;
max-width:650px;
}

.hero img{
width:220px;
}

.title{
font-size:36px;
font-weight:900;
margin-bottom:25px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:22px;
}

.card{
background:#0b0b0b;
border:1px solid #1f1f1f;
border-radius:28px;
padding:30px;
}

.card h3{
font-size:34px;
margin-bottom:14px;
}

.price{
font-size:42px;
font-weight:900;
color:#ff2e2e;
margin-bottom:20px;
}

.buy{
width:100%;
height:56px;
border-radius:14px;
background:#ff2e2e;
color:white;
font-size:16px;
font-weight:800;
}

@media(max-width:768px){

.hero{
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:42px;
}

.navbar{
height:auto;
padding:20px;
flex-direction:column;
gap:15px;
}

}

</style>
</head>

<body>

<div id="loginPage" class="login-screen">

<div class="login-box">

<div class="logo">i5s</div>

<div class="sub">
Secure Digital Store Login
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Login
</button>

<div class="register-btn" onclick="createAccount()">
Create Account
</div>

</div>

</div>

<div id="mainPage" class="hidden">

<div class="navbar">

<div class="logo-nav">
i5s
</div>

<div class="right">

<div class="balance">
Balance: $<span id="balance">0</span>
</div>

<div class="logout" onclick="logout()">
Logout
</div>

</div>

</div>

<div class="main">

<div class="hero">

<div>

<h1>Premium Store</h1>

<p>
Modern black & red premium digital store with account system,
saved login and balance support.
</p>

</div>

<img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">

</div>

<div class="title">
Products
</div>

<div class="products">

<div class="card">
<h3>1D</h3>
<div class="price">$10</div>
<button class="buy" onclick="buy(10)">
Purchase
</button>
</div>

<div class="card">
<h3>3D</h3>
<div class="price">$25</div>
<button class="buy" onclick="buy(25)">
Purchase
</button>
</div>

<div class="card">
<h3>Permanent</h3>
<div class="price">$150</div>
<button class="buy" onclick="buy(150)">
Purchase
</button>
</div>

</div>

</div>

</div>

<script>

const ADMIN_USERNAME = "woojun";
const ADMIN_PASSWORD = "F1AX65DvCA45X";

function loadUsers(){
return JSON.parse(localStorage.getItem("users")) || [];
}

function saveUsers(users){
localStorage.setItem("users",JSON.stringify(users));
}

let users = loadUsers();

if(!users.some(u => u.username === ADMIN_USERNAME)){

users.push({
username:ADMIN_USERNAME,
password:ADMIN_PASSWORD,
balance:999999
});

saveUsers(users);

}

let currentUser =
JSON.parse(localStorage.getItem("currentUser"));

window.onload = function(){

if(currentUser){

showMain();

}

}

function createAccount(){

let users = loadUsers();

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

if(username === "" || password === ""){

alert("Fill all fields");
return;

}

const exists =
users.some(user => user.username === username);

if(exists){

alert("Username already exists");
return;

}

const newUser = {

username:username,
password:password,
balance:0

};

users.push(newUser);

saveUsers(users);

localStorage.setItem(
"currentUser",
JSON.stringify(newUser)
);

currentUser = newUser;

alert("Account Created");

showMain();

}

function login(){

let users = loadUsers();

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const user =
users.find(u =>
u.username === username &&
u.password === password
);

if(!user){

alert("Invalid Account");
return;

}

currentUser = user;

localStorage.setItem(
"currentUser",
JSON.stringify(user)
);

showMain();

}

function showMain(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainPage")
.classList.remove("hidden");

document.getElementById("balance")
.innerText = currentUser.balance || 0;

}

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

function buy(price){

if(currentUser.balance < price){

alert("Not enough balance");
return;

}

currentUser.balance -= price;

document.getElementById("balance")
.innerText = currentUser.balance;

let users = loadUsers();

users = users.map(u => {

if(u.username === currentUser.username){

return currentUser;

}

return u;

});

saveUsers(users);

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

alert("Purchased");

}

</script>

</body>
</html>
