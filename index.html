<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i5s Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(255,0,0,.12);
filter:blur(120px);
top:-200px;
left:-150px;
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:rgba(255,0,0,.12);
filter:blur(120px);
bottom:-200px;
right:-150px;
z-index:-1;
}

.hidden{
display:none!important;
}

.login-screen{
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-box{
width:420px;
background:#0d0d0d;
border:1px solid #222;
border-radius:30px;
padding:45px;
box-shadow:0 0 40px rgba(255,0,0,.15);
}

.logo-login,
.logo{
font-family:'Orbitron',sans-serif;
font-weight:900;
background:linear-gradient(90deg,#ff2e2e,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.logo-login{
font-size:56px;
margin-bottom:10px;
}

.logo{
font-size:38px;
}

.login-sub{
color:#777;
margin-bottom:25px;
}

input{
width:100%;
height:58px;
background:#111;
border:1px solid #222;
border-radius:14px;
padding:0 18px;
color:white;
margin-bottom:15px;
outline:none;
}

.login-btn{
width:100%;
height:58px;
border:none;
border-radius:14px;
background:#ff2e2e;
color:white;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.register-btn{
text-align:center;
color:#999;
margin-top:18px;
cursor:pointer;
}

.navbar{
height:80px;
background:#080808;
border-bottom:1px solid #1b1b1b;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
}

.balance,
.logout-btn{
height:44px;
padding:0 22px;
background:#111;
border:1px solid #222;
border-radius:14px;
color:white;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
}

.logout-btn{
cursor:pointer;
}

.nav-right{
display:flex;
gap:12px;
align-items:center;
}

.page{
padding:35px;
}

.hero{
background:linear-gradient(135deg,#090909,#190707);
border:1px solid #221111;
border-radius:30px;
padding:60px;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px;
margin-bottom:35px;
}

.hero h1{
font-size:60px;
font-weight:900;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#999;
line-height:1.7;
max-width:700px;
}

.hero img{
width:220px;
}

.section-title{
font-size:38px;
font-weight:900;
margin-bottom:25px;
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:22px;
}

.product-card{
background:#0b0b0b;
border:1px solid #1f1f1f;
border-radius:28px;
padding:30px;
}

.product-card h3{
font-size:32px;
margin-bottom:15px;
}

.price{
font-size:42px;
font-weight:900;
color:#ff2e2e;
margin-bottom:20px;
}

.buy-btn{
width:100%;
height:58px;
border:none;
border-radius:16px;
background:#ff2e2e;
color:white;
font-size:16px;
font-weight:800;
cursor:pointer;
}

@media(max-width:768px){

.hero{
flex-direction:column;
text-align:center;
}

.hero h1{
font-size:42px;
}

.navbar{
height:auto;
padding:20px;
flex-direction:column;
gap:15px;
}

}

</style>
</head>

<body>

<div id="loginPage" class="login-screen">

<div class="login-box">

<h1 class="logo-login">i5s</h1>

<p class="login-sub">
Secure Digital Store Login
</p>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Login
</button>

<div class="register-btn" onclick="registerUser()">
Create Account
</div>

</div>

</div>

<div id="mainSite" class="hidden">

<div class="navbar">

<div class="logo">i5s</div>

<div class="nav-right">

<div class="balance">
Balance: $<span id="balance">0</span>
</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

</div>

<div class="page">

<div class="hero">

<div>

<h1>Premium Digital Store</h1>

<p>
Modern premium red dashboard with account system,
auto login and saved balance support.
</p>

</div>

<img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">

</div>

<h2 class="section-title">
Products
</h2>

<div class="product-grid">

<div class="product-card">
<h3>1D</h3>
<div class="price">$10</div>
<button class="buy-btn" onclick="buyProduct(10)">
Purchase
</button>
</div>

<div class="product-card">
<h3>3D</h3>
<div class="price">$25</div>
<button class="buy-btn" onclick="buyProduct(25)">
Purchase
</button>
</div>

<div class="product-card">
<h3>Permanent</h3>
<div class="price">$150</div>
<button class="buy-btn" onclick="buyProduct(150)">
Purchase
</button>
</div>

</div>

</div>

</div>

<script>

const ADMIN_USERNAME = "woojun";
const ADMIN_PASSWORD = "F1AX65DvCA45X";

let users =
JSON.parse(localStorage.getItem("users")) || [];

let currentUser =
JSON.parse(localStorage.getItem("currentUser")) || null;

if(!users.find(u => u.username === ADMIN_USERNAME)){

users.push({
username: ADMIN_USERNAME,
password: ADMIN_PASSWORD,
balance: 999999
});

localStorage.setItem(
"users",
JSON.stringify(users)
);

}

window.onload = () => {

const savedUser =
JSON.parse(localStorage.getItem("currentUser"));

if(savedUser){

currentUser = savedUser;

showSite();

}

}

function registerUser(){

let users =
JSON.parse(localStorage.getItem("users")) || [];

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

if(username === "" || password === ""){

alert("Fill all fields");
return;

}

const exists =
users.find(user => user.username === username);

if(exists){

alert("Username already exists");
return;

}

const newUser = {

username: username,
password: password,
balance: 0

};

users.push(newUser);

localStorage.setItem(
"users",
JSON.stringify(users)
);

localStorage.setItem(
"currentUser",
JSON.stringify(newUser)
);

currentUser = newUser;

alert("Account Created Successfully");

showSite();

}

function login(){

users =
JSON.parse(localStorage.getItem("users")) || [];

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const user =
users.find(u =>
u.username === username &&
u.password === password
);

if(!user){

alert("Invalid Account");
return;

}

currentUser = user;

localStorage.setItem(
"currentUser",
JSON.stringify(user)
);

showSite();

}

function showSite(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainSite")
.classList.remove("hidden");

document.getElementById("balance")
.innerText = currentUser.balance;

}

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

function buyProduct(price){

if(currentUser.balance < price){

alert("Not enough balance");
return;

}

currentUser.balance -= price;

document.getElementById("balance")
.innerText = currentUser.balance;

users = users.map(u => {

if(u.username === currentUser.username){

return currentUser;

}

return u;

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

alert("Purchased");

}

</script>

</body>
</html>
