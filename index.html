<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i5s Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050505;
color:white;
}

.hidden{
display:none;
}

.login-screen{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
width:350px;
background:#111;
padding:30px;
border-radius:20px;
border:1px solid #333;
}

.logo{
font-size:45px;
font-weight:bold;
color:#ff2e2e;
margin-bottom:10px;
}

.sub{
color:#888;
margin-bottom:20px;
}

input{
width:100%;
height:50px;
background:#1a1a1a;
border:1px solid #333;
border-radius:10px;
padding:10px;
color:white;
margin-bottom:15px;
}

button{
height:50px;
border:none;
border-radius:10px;
background:#ff2e2e;
color:white;
font-weight:bold;
cursor:pointer;
}

.login-btn{
width:100%;
}

.create-btn{
margin-top:10px;
width:100%;
background:#222;
}

.navbar{
height:70px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #222;
}

.nav-right{
display:flex;
gap:10px;
align-items:center;
}

.balance{
padding:10px 15px;
background:#1a1a1a;
border-radius:10px;
}

.nav-btn{
padding:10px 15px;
background:#1a1a1a;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

.page{
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;
padding:20px;
border-radius:20px;
border:1px solid #222;
}

.card h2{
margin-bottom:10px;
}

.price{
font-size:35px;
font-weight:bold;
color:#ff2e2e;
margin-bottom:15px;
}

.buy-btn{
width:100%;
}

.topup-box{
max-width:500px;
background:#111;
padding:20px;
border-radius:20px;
border:1px solid #222;
}

.inventory-item{
background:#111;
padding:20px;
border-radius:20px;
margin-bottom:15px;
border:1px solid #222;
}

.request{
background:#111;
padding:20px;
border-radius:20px;
margin-bottom:15px;
border:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

.actions{
display:flex;
gap:10px;
}

.approve{
background:#ff2e2e;
padding:10px 15px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

.reject{
background:#333;
padding:10px 15px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div id="loginPage" class="login-screen">

<div class="login-box">

<div class="logo">
i5s
</div>

<div class="sub">
Secure Digital Store
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Login
</button>

<button class="create-btn" onclick="register()">
Create Account
</button>

</div>

</div>

<div id="mainSite" class="hidden">

<div class="navbar">

<div class="logo">
i5s
</div>

<div class="nav-right">

<div class="balance">
$<span id="balance">0</span>
</div>

<button class="nav-btn" onclick="showPage('shop')">
Shop
</button>

<button class="nav-btn" onclick="showPage('topup')">
TopUp
</button>

<button class="nav-btn" onclick="showPage('inventory')">
Inventory
</button>

<button id="adminButton" class="nav-btn hidden" onclick="showPage('admin')">
Admin
</button>

<button class="nav-btn" onclick="logout()">
Logout
</button>

</div>

</div>

<div id="shop" class="page">

<h1 style="margin-bottom:20px;">
Products
</h1>

<div class="grid">

<div class="card">
<h2>1D</h2>
<div class="price">$10</div>
<button class="buy-btn" onclick="buy(10,'1D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>3D</h2>
<div class="price">$25</div>
<button class="buy-btn" onclick="buy(25,'3D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>5D</h2>
<div class="price">$40</div>
<button class="buy-btn" onclick="buy(40,'5D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>7D</h2>
<div class="price">$60</div>
<button class="buy-btn" onclick="buy(60,'7D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>10D</h2>
<div class="price">$85</div>
<button class="buy-btn" onclick="buy(85,'10D Access')">
Purchase
</button>
</div>

<div class="card">
<h2>Permanent</h2>
<div class="price">$150</div>
<button class="buy-btn" onclick="buy(150,'Permanent Access')">
Purchase
</button>
</div>

</div>

</div>

<div id="topup" class="page hidden">

<h1 style="margin-bottom:20px;">
Top Up
</h1>

<div class="topup-box">

<input type="number" id="amount" placeholder="Amount">

<button style="width:100%;" onclick="createRequest()">
Create TopUp Request
</button>

</div>

</div>

<div id="inventory" class="page hidden">

<h1 style="margin-bottom:20px;">
Inventory
</h1>

<div id="inventoryList"></div>

</div>

<div id="admin" class="page hidden">

<h1 style="margin-bottom:20px;">
Admin Requests
</h1>

<div id="requests"></div>

</div>

</div>

<script>

const ADMIN_USERNAME = "woojun";
const ADMIN_PASSWORD = "F1AX65DvCA45X";

let users =
JSON.parse(localStorage.getItem("users")) || [];

let requests =
JSON.parse(localStorage.getItem("requests")) || [];

let currentUser =
JSON.parse(localStorage.getItem("currentUser")) || null;

const adminExists =
users.find(u => u.username === ADMIN_USERNAME);

if(!adminExists){

users.push({

username:ADMIN_USERNAME,
password:ADMIN_PASSWORD,
balance:0,
inventory:[]

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

}

if(currentUser){

showSite();

}

function register(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

if(!username || !password){

alert("Fill all fields");
return;

}

const exists =
users.find(u => u.username === username);

if(exists){

alert("Username already exists");
return;

}

const user = {

username:username,
password:password,
balance:0,
inventory:[]

};

users.push(user);

localStorage.setItem(
"users",
JSON.stringify(users)
);

alert("Account Created");

}

function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const user =
users.find(u =>
u.username === username &&
u.password === password
);

if(!user){

alert("Invalid Account");
return;

}

currentUser = user;

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

showSite();

}

function showSite(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainSite")
.classList.remove("hidden");

document.getElementById("balance")
.innerText = currentUser.balance;

renderInventory();

renderRequests();

if(
currentUser.username === ADMIN_USERNAME &&
currentUser.password === ADMIN_PASSWORD
){

document.getElementById("adminButton")
.classList.remove("hidden");

}

}

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

function showPage(page){

document.getElementById("shop")
.classList.add("hidden");

document.getElementById("topup")
.classList.add("hidden");

document.getElementById("inventory")
.classList.add("hidden");

document.getElementById("admin")
.classList.add("hidden");

document.getElementById(page)
.classList.remove("hidden");

}

function saveUser(){

users = users.map(u => {

if(u.username === currentUser.username){

return currentUser;

}

return u;

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

}

function buy(price,name){

if(currentUser.balance < price){

alert("Not enough balance");
return;

}

currentUser.balance -= price;

currentUser.inventory.push(name);

saveUser();

document.getElementById("balance")
.innerText = currentUser.balance;

renderInventory();

alert("Purchased");

}

function renderInventory(){

const list =
document.getElementById("inventoryList");

list.innerHTML = "";

if(currentUser.inventory.length === 0){

list.innerHTML = `
<div class="inventory-item">
No Items
</div>
`;

return;

}

currentUser.inventory.forEach(item => {

list.innerHTML += `
<div class="inventory-item">
${item}
</div>
`;

});

}

function createRequest(){

const amount =
document.getElementById("amount").value;

if(!amount || amount <= 0){

alert("Invalid Amount");
return;

}

requests.push({

id:Date.now(),
user:currentUser.username,
amount:Number(amount)

});

localStorage.setItem(
"requests",
JSON.stringify(requests)
);

renderRequests();

alert("Request Created");

}

function renderRequests(){

const box =
document.getElementById("requests");

box.innerHTML = "";

requests.forEach(req => {

box.innerHTML += `

<div class="request">

<div>
${req.user} - $${req.amount}
</div>

<div class="actions">

<button class="approve"
onclick="approve(${req.id})">

Approve

</button>

<button class="reject"
onclick="rejectReq(${req.id})">

Reject

</button>

</div>

</div>

`;

});

}

function approve(id){

const req =
requests.find(r => r.id === id);

if(!req){

return;

}

const user =
users.find(u => u.username === req.user);

user.balance += Number(req.amount);

localStorage.setItem(
"users",
JSON.stringify(users)
);

requests =
requests.filter(r => r.id !== id);

localStorage.setItem(
"requests",
JSON.stringify(requests)
);

renderRequests();

alert("Approved");

}

function rejectReq(id){

requests =
requests.filter(r => r.id !== id);

localStorage.setItem(
"requests",
JSON.stringify(requests)
);

renderRequests();

alert("Rejected");

}

</script>

</body>
</html>
