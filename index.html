<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i5s Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:#050505;
            color:white;
            overflow-x:hidden;
        }

        body::before{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:rgba(255,0,0,0.12);
            filter:blur(120px);
            top:-200px;
            left:-150px;
            z-index:-1;
        }

        body::after{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:rgba(255,0,0,0.12);
            filter:blur(120px);
            bottom:-200px;
            right:-150px;
            z-index:-1;
        }

        .login-screen{
            width:100%;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-box{
            width:420px;
            background:#0d0d0d;
            border:1px solid #222;
            border-radius:30px;
            padding:45px;
            box-shadow:0 0 40px rgba(255,0,0,0.15);
        }

        .logo-login{
            font-size:54px;
            font-family:'Orbitron',sans-serif;
            font-weight:900;
            background:linear-gradient(90deg,#ff2e2e,#ffffff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            margin-bottom:10px;
        }

        .login-sub{
            color:#777;
            margin-bottom:25px;
        }

        .login-box input{
            width:100%;
            height:58px;
            background:#111;
            border:1px solid #222;
            border-radius:14px;
            padding:0 18px;
            color:white;
            margin-bottom:15px;
            outline:none;
        }

        .login-btn{
            width:100%;
            height:58px;
            border:none;
            border-radius:14px;
            background:#ff2e2e;
            color:white;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
        }

        .register-btn{
            text-align:center;
            color:#999;
            margin-top:18px;
            cursor:pointer;
        }

        .navbar{
            height:80px;
            background:#080808;
            border-bottom:1px solid #1b1b1b;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 28px;
        }

        .logo{
            font-size:38px;
            font-family:'Orbitron',sans-serif;
            font-weight:900;
            background:linear-gradient(90deg,#ff2e2e,#ffffff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .nav-right{
            display:flex;
            gap:12px;
            align-items:center;
            flex-wrap:wrap;
        }

        .balance{
            height:44px;
            padding:0 22px;
            background:#111;
            border:1px solid #222;
            border-radius:14px;
            color:white;
            font-weight:700;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .nav-btn,
        .logout-btn{
            height:44px;
            padding:0 22px;
            background:#111;
            border:1px solid #222;
            border-radius:14px;
            color:white;
            font-weight:700;
            cursor:pointer;
        }

        .active-btn,
        .nav-btn:hover,
        .logout-btn:hover{
            background:#ff2e2e;
            border-color:#ff2e2e;
        }

        .page{
            display:none;
            padding:35px;
        }

        .active-page{
            display:block;
        }

        .hero{
            background:linear-gradient(135deg,#090909,#190707);
            border:1px solid #221111;
            border-radius:30px;
            padding:60px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:30px;
            margin-bottom:35px;
        }

        .hero h1{
            font-size:60px;
            font-weight:900;
            margin-bottom:15px;
        }

        .hero p{
            font-size:18px;
            color:#999;
            max-width:700px;
            line-height:1.7;
        }

        .hero img{
            width:220px;
        }

        .section-title{
            font-size:38px;
            font-weight:900;
            margin-bottom:25px;
        }

        .product-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:22px;
        }

        .product-card{
            background:#0b0b0b;
            border:1px solid #1f1f1f;
            border-radius:28px;
            padding:30px;
        }

        .product-card img{
            width:70px;
            margin-bottom:20px;
        }

        .product-card h3{
            font-size:32px;
            margin-bottom:15px;
        }

        .price{
            font-size:42px;
            font-weight:900;
            color:#ff2e2e;
            margin-bottom:20px;
        }

        .buy-btn{
            width:100%;
            height:58px;
            border:none;
            border-radius:16px;
            background:#ff2e2e;
            color:white;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="login-screen">

    <div class="login-box">

        <h1 class="logo-login">
            i5s
        </h1>

        <p class="login-sub">
            Secure Digital Store Login
        </p>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <div class="register-btn" onclick="register()">
            Create Account
        </div>

    </div>

</div>

<script>

    const adminData = {
        username:"woojun",
        password:"F1AX65DvCA45X",
        balance:0,
        inventory:[]
    };

    let users =
    JSON.parse(localStorage.getItem("users")) || [];

    const adminExists =
    users.find(u => u.username === adminData.username);

    if(!adminExists){

        users.push(adminData);

        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );

    }

    function register(){

        const username =
        document.getElementById("username").value.trim();

        const password =
        document.getElementById("password").value.trim();

        if(!username || !password){

            alert("Fill all fields");
            return;

        }

        const exists =
        users.find(u => u.username === username);

        if(exists){

            alert("Username already exists");
            return;

        }

        const user = {

            username:username,
            password:password,
            balance:0,
            inventory:[]

        };

        users.push(user);

        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );

        alert("Account created successfully");

    }

    function login(){

        const username =
        document.getElementById("username").value.trim();

        const password =
        document.getElementById("password").value.trim();

        const user =
        users.find(u =>
            u.username === username &&
            u.password === password
        );

        if(!user){

            alert("Invalid account");
            return;

        }

        localStorage.setItem(
            "currentUser",
            JSON.stringify(user)
        );

        alert("Login Success");

        location.reload();

    }

</script>

</body>
</html>
