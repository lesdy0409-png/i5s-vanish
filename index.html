<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>i5s Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#000;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
top:-300px;
left:-300px;
width:700px;
height:700px;
background:rgba(255,0,0,.12);
filter:blur(120px);
z-index:-1;
}

body::after{
content:'';
position:fixed;
bottom:-300px;
right:-300px;
width:700px;
height:700px;
background:rgba(255,0,0,.12);
filter:blur(120px);
z-index:-1;
}

.hidden{
display:none !important;
}

.login-screen{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
width:430px;
background:#090909;
border:1px solid #1d1d1d;
border-radius:28px;
padding:40px;
box-shadow:0 0 40px rgba(255,0,0,.15);
}

.logo{
font-size:60px;
font-weight:900;
color:#ff3a3a;
margin-bottom:10px;
}

.login-sub{
color:#777;
margin-bottom:25px;
}

input{
width:100%;
height:60px;
background:#0f0f0f;
border:1px solid #1d1d1d;
border-radius:16px;
padding:0 20px;
color:white;
font-size:16px;
margin-bottom:16px;
outline:none;
}

button{
border:none;
cursor:pointer;
}

.login-btn{
width:100%;
height:58px;
background:#ff2d2d;
color:white;
font-size:16px;
font-weight:800;
border-radius:16px;
margin-bottom:14px;
}

.register-btn{
width:100%;
height:58px;
background:#111;
color:white;
font-size:16px;
font-weight:700;
border-radius:16px;
}

.navbar{
height:85px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 25px;
border-bottom:1px solid #161616;
background:#050505;
}

.nav-left{
font-size:40px;
font-weight:900;
color:#ff3a3a;
}

.nav-right{
display:flex;
gap:12px;
align-items:center;
flex-wrap:wrap;
}

.nav-btn{
height:46px;
padding:0 22px;
background:#111;
border:1px solid #222;
color:white;
border-radius:14px;
font-weight:700;
}

.nav-btn:hover{
background:#ff2d2d;
}

.balance{
padding:0 22px;
height:46px;
display:flex;
align-items:center;
justify-content:center;
background:#111;
border-radius:14px;
border:1px solid #222;
font-weight:800;
}

.page{
display:none;
padding:30px;
}

.active-page{
display:block;
}

.section-title{
font-size:55px;
font-weight:900;
margin-bottom:30px;
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
}

.product-card{
background:#080808;
border:1px solid #1b1b1b;
border-radius:24px;
padding:28px;
}

.product-card h2{
font-size:42px;
margin-bottom:15px;
}

.price{
font-size:52px;
font-weight:900;
color:#ff2d2d;
margin-bottom:25px;
}

.buy-btn{
width:100%;
height:58px;
background:#ff2d2d;
color:white;
font-size:17px;
font-weight:800;
border-radius:16px;
}

.inventory-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.inventory-item{
background:#0b0b0b;
border:1px solid #1b1b1b;
border-radius:20px;
padding:25px;
}

.inventory-item h3{
font-size:28px;
margin-bottom:10px;
}

.topup-box{
max-width:900px;
margin:auto;
background:#090909;
border:1px solid #1b1b1b;
border-radius:28px;
padding:35px;
}

.topup-title{
font-size:50px;
font-weight:900;
margin-bottom:8px;
}

.topup-sub{
color:#888;
margin-bottom:35px;
}

.crypto-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
margin-bottom:25px;
}

.crypto-card{
background:#0f0f0f;
border:1px solid #222;
border-radius:18px;
padding:22px;
cursor:pointer;
transition:.2s;
}

.crypto-card.active{
border-color:#00ff73;
background:#0f2418;
}

.crypto-card h3{
font-size:24px;
margin-bottom:6px;
}

.quick-grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:12px;
margin-bottom:25px;
}

.quick-grid button{
height:50px;
background:#111;
border:1px solid #222;
border-radius:12px;
color:white;
font-weight:700;
}

.quick-grid button:hover{
background:#ff2d2d;
}

.topup-btn{
width:100%;
height:62px;
background:#0f7a39;
color:white;
font-size:18px;
font-weight:800;
border-radius:16px;
}

.request-box{
background:#0b0b0b;
border:1px solid #1d1d1d;
border-radius:22px;
padding:24px;
margin-bottom:20px;
}

.request-top{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.request-buttons{
display:flex;
gap:12px;
}

.approve-btn{
background:#14a44d;
color:white;
height:48px;
padding:0 20px;
border-radius:12px;
font-weight:700;
}

.reject-btn{
background:#ff2d2d;
color:white;
height:48px;
padding:0 20px;
border-radius:12px;
font-weight:700;
}

@media(max-width:700px){

.quick-grid{
grid-template-columns:repeat(2,1fr);
}

.section-title{
font-size:38px;
}

}

</style>
</head>

<body>

<div id="loginPage" class="login-screen">

<div class="login-box">

<div class="logo">i5s</div>

<div class="login-sub">
Secure Digital Store Login
</div>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="login-btn" onclick="login()">
Login
</button>

<button class="register-btn" onclick="register()">
Create Account
</button>

</div>

</div>

<div id="mainSite" class="hidden">

<div class="navbar">

<div class="nav-left">i5s</div>

<div class="nav-right">

<div class="balance">
Balance: $<span id="balance">0</span>
</div>

<button class="nav-btn" onclick="showPage('shop')">
Shop
</button>

<button class="nav-btn" onclick="showPage('inventory')">
Inventory
</button>

<button class="nav-btn" onclick="showPage('topup')">
Top Up
</button>

<button class="nav-btn hidden" id="adminButton" onclick="showPage('admin')">
Admin
</button>

<button class="nav-btn" onclick="logout()">
Logout
</button>

</div>

</div>

<div id="shop" class="page active-page">

<h1 class="section-title">Products</h1>

<div class="product-grid">

<div class="product-card">
<h2>1D</h2>
<div class="price">$10</div>
<button class="buy-btn" onclick="buyProduct(10,'1D Access')">
Purchase
</button>
</div>

<div class="product-card">
<h2>3D</h2>
<div class="price">$25</div>
<button class="buy-btn" onclick="buyProduct(25,'3D Access')">
Purchase
</button>
</div>

<div class="product-card">
<h2>5D</h2>
<div class="price">$40</div>
<button class="buy-btn" onclick="buyProduct(40,'5D Access')">
Purchase
</button>
</div>

<div class="product-card">
<h2>7D</h2>
<div class="price">$50</div>
<button class="buy-btn" onclick="buyProduct(50,'7D Access')">
Purchase
</button>
</div>

<div class="product-card">
<h2>10D</h2>
<div class="price">$80</div>
<button class="buy-btn" onclick="buyProduct(80,'10D Access')">
Purchase
</button>
</div>

<div class="product-card">
<h2>Permanent</h2>
<div class="price">$150</div>
<button class="buy-btn" onclick="buyProduct(150,'Permanent Access')">
Purchase
</button>
</div>

</div>

</div>

<div id="inventory" class="page">

<h1 class="section-title">Inventory</h1>

<div id="inventoryGrid" class="inventory-grid"></div>

</div>

<div id="topup" class="page">

<div class="topup-box">

<div class="topup-title">
Top Up Your Balance
</div>

<div class="topup-sub">
Pay in crypto — choose your coin and network
</div>

<div class="crypto-grid">

<div class="crypto-card active">
<h3>BTC</h3>
<p>Bitcoin</p>
</div>

<div class="crypto-card">
<h3>LTC</h3>
<p>Litecoin</p>
</div>

<div class="crypto-card">
<h3>USDT</h3>
<p>Tether</p>
</div>

<div class="crypto-card">
<h3>SOL</h3>
<p>Solana</p>
</div>

<div class="crypto-card">
<h3>BNB</h3>
<p>BNB Chain</p>
</div>

<div class="crypto-card">
<h3>TRX</h3>
<p>Tron</p>
</div>

</div>

<input type="number" id="topupAmount" placeholder="Enter Amount">

<div class="quick-grid">

<button onclick="setAmount(10)">$10</button>
<button onclick="setAmount(25)">$25</button>
<button onclick="setAmount(50)">$50</button>
<button onclick="setAmount(100)">$100</button>
<button onclick="setAmount(250)">$250</button>
<button onclick="setAmount(500)">$500</button>

</div>

<button class="topup-btn" onclick="createRequest()">
Create Payment
</button>

</div>

</div>

<div id="admin" class="page">

<h1 class="section-title">Admin Panel</h1>

<div id="requestContainer"></div>

</div>

</div>

<script>

const ADMIN_USERNAME = "woojun";
const ADMIN_PASSWORD = "F1AX65DvCA45X";

let users = JSON.parse(localStorage.getItem("users")) || [];
let requests = JSON.parse(localStorage.getItem("requests")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;

if(!users.find(u => u.username === ADMIN_USERNAME)){

users.push({
username:ADMIN_USERNAME,
password:ADMIN_PASSWORD,
balance:999999,
inventory:[]
});

localStorage.setItem(
"users",
JSON.stringify(users)
);

}

window.addEventListener("storage", () => {

users =
JSON.parse(localStorage.getItem("users")) || [];

requests =
JSON.parse(localStorage.getItem("requests")) || [];

renderRequests();

});

window.onload = function(){

users =
JSON.parse(localStorage.getItem("users")) || [];

requests =
JSON.parse(localStorage.getItem("requests")) || [];

currentUser =
JSON.parse(localStorage.getItem("currentUser")) || null;

if(currentUser){

showMain();

}

};

function register(){

users =
JSON.parse(localStorage.getItem("users")) || [];

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

if(username === "" || password === ""){

alert("Fill all fields");
return;

}

const exists = users.find(
u => u.username.toLowerCase() === username.toLowerCase()
);

if(exists){

alert("Username already exists");
return;

}

users.push({
username:username,
password:password,
balance:0,
inventory:[]
});

localStorage.setItem(
"users",
JSON.stringify(users)
);

alert("Account Created Successfully");

document.getElementById("username").value = "";
document.getElementById("password").value = "";

}

function login(){

users =
JSON.parse(localStorage.getItem("users")) || [];

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const foundUser = users.find(
u => u.username === username &&
u.password === password
);

if(!foundUser){

alert("Invalid Account");
return;

}

currentUser = foundUser;

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

showMain();

}

function showMain(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainSite")
.classList.remove("hidden");

updateBalance();

renderInventory();

renderRequests();

if(currentUser.username === ADMIN_USERNAME){

document.getElementById("adminButton")
.classList.remove("hidden");

}

}

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

function updateBalance(){

document.getElementById("balance").innerText =
currentUser.balance;

}

function saveUsers(){

users = users.map(u => {

if(u.username === currentUser.username){

return currentUser;

}

return u;

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

localStorage.setItem(
"currentUser",
JSON.stringify(currentUser)
);

}

function showPage(page){

document.querySelectorAll(".page")
.forEach(p => {

p.classList.remove("active-page");

});

document.getElementById(page)
.classList.add("active-page");

if(page === "admin"){

renderRequests();

}

}

function buyProduct(price,name){

if(currentUser.balance < price){

alert("Not enough balance");
return;

}

currentUser.balance -= price;

currentUser.inventory.push(name);

saveUsers();

updateBalance();

renderInventory();

alert(name + " Purchased");

}

function renderInventory(){

const grid =
document.getElementById("inventoryGrid");

grid.innerHTML = "";

if(currentUser.inventory.length === 0){

grid.innerHTML = `
<div class="inventory-item">
<h3>Empty</h3>
<p>No items purchased yet.</p>
</div>
`;

return;

}

currentUser.inventory.forEach(item => {

grid.innerHTML += `
<div class="inventory-item">
<h3>${item}</h3>
<p>Purchased Successfully</p>
</div>
`;

});

}

document.querySelectorAll(".crypto-card")
.forEach(card => {

card.addEventListener("click",function(){

document.querySelectorAll(".crypto-card")
.forEach(c => {

c.classList.remove("active");

});

card.classList.add("active");

});

});

function setAmount(amount){

document.getElementById("topupAmount").value =
amount;

}

function createRequest(){

requests =
JSON.parse(localStorage.getItem("requests")) || [];

const amount =
document.getElementById("topupAmount").value;

if(amount === "" || Number(amount) <= 0){

alert("Enter valid amount");
return;

}

const selectedCrypto =
document.querySelector(".crypto-card.active h3")
.innerText;

requests.push({

id:Date.now(),

user:currentUser.username,

amount:Number(amount),

crypto:selectedCrypto,

status:"Pending",

created:new Date().toLocaleString()

});

localStorage.setItem(
"requests",
JSON.stringify(requests)
);

alert("Payment Request Created");

document.getElementById("topupAmount").value = "";

renderRequests();

}

function renderRequests(){

requests =
JSON.parse(localStorage.getItem("requests")) || [];

const container =
document.getElementById("requestContainer");

if(!container){

return;

}

container.innerHTML = "";

if(requests.length === 0){

container.innerHTML = `
<div class="request-box">
<h2>No Requests</h2>
</div>
`;

return;

}

requests.forEach(req => {

container.innerHTML += `

<div class="request-box">

<div class="request-top">

<div>

<h2>$${req.amount}</h2>

<p>User: ${req.user}</p>

<p>Crypto: ${req.crypto}</p>

<p>Status: ${req.status}</p>

<p>${req.created}</p>

</div>

<div class="request-buttons">

<button class="approve-btn"
onclick="approveRequest(${req.id})">
Approve
</button>

<button class="reject-btn"
onclick="rejectRequest(${req.id})">
Reject
</button>

</div>

</div>

</div>

`;

});

}

function approveRequest(id){

requests =
JSON.parse(localStorage.getItem("requests")) || [];

users =
JSON.parse(localStorage.getItem("users")) || [];

const req =
requests.find(r => r.id === id);

if(!req){

alert("Request Not Found");
return;

}

const targetUser =
users.find(u => u.username === req.user);

if(!targetUser){

alert("User Not Found");
return;

}

targetUser.balance += Number(req.amount);

localStorage.setItem(
"users",
JSON.stringify(users)
);

requests =
requests.filter(r => r.id !== id);

localStorage.setItem(
"requests",
JSON.stringify(requests)
);

renderRequests();

alert("Approved Successfully");

}

function rejectRequest(id){

requests =
JSON.parse(localStorage.getItem("requests")) || [];

requests =
requests.filter(r => r.id !== id);

localStorage.setItem(
"requests",
JSON.stringify(requests)
);

renderRequests();

alert("Rejected");

}

</script>

</body>
</html>
